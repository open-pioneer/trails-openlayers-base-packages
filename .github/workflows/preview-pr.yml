# Deploys a preview for every pull request.
name: Preview PR

on:
  workflow_run:
    workflows:
      - Build Samples
    types:
      - completed

permissions:
  contents: read

jobs:
  preview:
    name: Preview PR
    uses: open-pioneer/trails-repo-automation/.github/workflows/shared-preview-pr.yml@038ec2c85b78d22432bf0264f74a6544278f71f3 # main
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      demo-id: openlayers-base-packages
    secrets:
      DEMO_DEPLOY_TOKEN: ${{ secrets.DEMO_DEPLOY_TOKEN }}
