<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    Cursor der Umkreissuche „Nächste Haltestellen": roter Karten-Pin mit weißer Zielscheibe.
    Feste fachliche Kartenfarbe (Rot #c53030, identisch zur Busradar-Delay-Rotstufe); ein
    CSS-Cursor kann keine Theme-Tokens referenzieren. Hotspot = untere Pin-Spitze (16, 31).
  -->
