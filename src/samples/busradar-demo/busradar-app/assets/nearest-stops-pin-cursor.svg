  />
  <circle cx="16" cy="12" r="7" fill="#ffffff" />
  <circle cx="16" cy="12" r="4.6" fill="none" stroke="#c53030" stroke-width="1.4" />
  <line x1="16" y1="5.2" x2="16" y2="18.8" stroke="#c53030" stroke-width="1.4" stroke-linecap="round" />
  <line x1="9.2" y1="12" x2="22.8" y2="12" stroke="#c53030" stroke-width="1.4" stroke-linecap="round" />
  <circle cx="16" cy="12" r="1.3" fill="#c53030" />
</svg>
