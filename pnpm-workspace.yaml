packages:
  - src/**
  - "!**/test-data/**"
  - "!**/dist/**"

# https://pnpm.io/catalogs
catalog:
  # Trails core packages
  # https://github.com/open-pioneer/trails-core-packages
  "@open-pioneer/base-theme": ^4.7.0
  "@open-pioneer/core": ^4.7.0
  "@open-pioneer/http": ^4.7.0
  "@open-pioneer/integration": ^4.7.0
  "@open-pioneer/local-storage": ^4.7.0
  "@open-pioneer/notifier": ^4.7.0
  "@open-pioneer/react-utils": ^4.7.0
  "@open-pioneer/reactivity": ^4.7.0
  "@open-pioneer/runtime": ^4.7.0
  "@open-pioneer/test-utils": ^4.7.0
  "@open-pioneer/chakra-snippets": ^4.7.0

  # Frontend dependencies
  "@chakra-ui/react": ^3.36.1
  "@conterra/reactivity-core": ^0.8.6
  "@conterra/reactivity-events": ^0.8.6
  "@emotion/cache": ^11.14.0
  "@emotion/react": ^11.14.0
  "@emotion/styled": ^11.14.1
  "@esri/arcgis-html-sanitizer": "^4.1.0"
  "@formatjs/intl": ^4.1.18
  "@tanstack/react-table": ^8.21.3
  html2canvas: ^1.4.1
  jspdf: ^4.2.1
  ol-mapbox-style: ^13.4.2
  ol: ^10.10.0
  proj4: ^2.21.0
  react-dom: ^19.2.8
  react-icons: ^5.7.0
  react-use: ^17.6.1
  react: ^19.2.8
  uuid: ^14.0.1

  # Devtools
  "@changesets/cli": ^2.31.1
  "@open-pioneer/build-package-cli": ^4.0.0
  "@open-pioneer/build-support": ^4.0.0
  "@open-pioneer/changesets-release-line": ^0.2.0
  "@open-pioneer/check-pnpm-duplicates": ^0.4.0
  "@open-pioneer/vite-plugin-pioneer": ^7.0.0
  "@testing-library/dom": ^10.4.1
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.2
  "@testing-library/user-event": ^14.6.4
  "@types/js-yaml": ^4.0.9
  "@types/jsdom": ^30.0.0
  "@types/node": ^24.13.3
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@vitejs/plugin-react": "^6.0.5"
  "@tony.ganchev/eslint-plugin-header": ^3.4.4
  fast-glob: ^3.3.3
  handlebars: ^4.7.9
  happy-dom: ^20.11.2
  husky: ^9.1.7
  js-yaml: ^5.3.0
  jsdom: ^30.0.1
  lint-staged: ^17.3.0
  oxlint: ^1.78.0
  oxfmt: ^0.64.0
  resize-observer-polyfill: ^1.5.1
  rimraf: ^6.1.3
  sass: ^1.102.0
  tsx: ^4.23.12
  typedoc: ^0.28.20
  typescript: ^6.0.3
  vite: ^8.2.1
  vitest: ^4.1.10
  zx: ^8.8.5

overrides:
  # We don't actually use the babel plugin.
  # The babel runtime is also not used as a production dependency.
  # See e.g. https://github.com/emotion-js/emotion/issues/2371
  "@emotion/react>@emotion/babel-plugin": "-"
  "@emotion/styled>@emotion/babel-plugin": "-"
  "@emotion/react>@babel/runtime": "-"
  "@emotion/styled>@babel/runtime": "-"

  # Just to get rid of some duplicate dependencies
  "stylis@<4.3.5": ">= 4.3.5"
  "regenerator-runtime@<=0.13.11": "^0.14.0"
  "csstype@<3.2.3": ">=3.2.3"
  "geotiff@>=3.0.5 <3.1.0-beta.0": "^3.1.0-beta.0"

  # Ensure patched packages have the expected version (patch was tested with this version):
  "@chakra-ui/react": "3.36.1"
  "@ark-ui/react": "5.37.2"
  "@zag-js/interact-outside": "1.41.2"

  # https://github.com/advisories/GHSA-g7r4-m6w7-qqqr
  # https://github.com/advisories/GHSA-gv7w-rqvm-qjhr
  "esbuild@<=0.28.0": "^0.28.1"

  # https://github.com/advisories/GHSA-h67p-54hq-rp68, CVE-2026-53550
  "js-yaml@>=4.0.0 <4.3.1": "^4.3.1"

  # https://github.com/advisories/GHSA-52cp-r559-cp3m, CVE-2026-59869
  # https://github.com/advisories/GHSA-5p4m-2wfm-xmqj,
  "js-yaml@>=3.0.0 <3.15.1": "^3.15.1"

  # https://github.com/advisories/GHSA-3jxr-9vmj-r5cp, CVE-2026-13149
  # https://github.com/advisories/GHSA-mh99-v99m-4gvg, CVE-2026-14257
  # https://github.com/advisories/GHSA-rgw5-rvv9-x895, CVE-2026-69152
  "brace-expansion@<1.1.18": "^1.1.18"
  "brace-expansion@>=3.0.0 <5.0.8": "^5.0.9"

  # https://github.com/advisories/GHSA-xvcm-6775-5m9r, CVE-2026-59880
  "immutable@>=5.0.0 <5.1.8": "^5.1.8"

  # https://github.com/advisories/GHSA-c2j3-45gr-mqc4
  "dompurify@<=3.4.11": "^3.4.12"

  # https://github.com/advisories/GHSA-fxqj-rqcc-2cmp, CVE-2026-69153
  "postcss@<=8.5.22": "^8.5.23"

  # https://github.com/advisories/GHSA-2v37-7h3g-55p8, CVE-2026-67213
  "nanoid@<3.3.17": "^3.3.17"

  # https://github.com/advisories/GHSA-55q2-fjhq-7xh7
  "dompurify@<=3.4.12": "^3.4.13"

allowUnusedPatches: true
patchedDependencies:
  # Ensure all portals are mounted under `.pioneer-root` div
  "@ark-ui/react@*": "patches/@ark-ui__react.patch"

  # Fixes 'interact-outside' logic not tabbing between elements within the same shadow dom.
  # Can be removed if https://github.com/chakra-ui/zag/issues/3088 is fixed.
  "@zag-js/interact-outside": patches/@zag-js__interact-outside.patch

peerDependencyRules:
  allowedVersions:
    # See overrides
    "fdir>picomatch": "*"
    "rollup": "*"

auditConfig:
  ignoreGhsas:
    # https://github.com/advisories/GHSA-h67p-54hq-rp68, CVE-2026-53550
    - GHSA-h67p-54hq-rp68

    # https://github.com/advisories/GHSA-mh99-v99m-4gvg, CVE-2026-14257
    - GHSA-mh99-v99m-4gvg

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  # Seems to work without build scripts; may revisit later if actually needed.
  core-js: false
  unrs-resolver: false

trustPolicy: no-downgrade
trustPolicyExclude:
  - "undici-types@6.21.0"
  - "semver@6.3.1"
  - "chokidar@4.0.3"
  - "rollup@2.80.0"

# Install older versions by default
resolutionMode: "lowest-direct"

# Configure a release cooldown
minimumReleaseAge: 4320 # 3 days in minutes
minimumReleaseAgeExclude:
  - "@open-pioneer/*"
  - "@conterra/*"
  - "nanoid@3.3.15"
  # Renovate security update: js-yaml@4.2.0
  - js-yaml@4.2.0

# Workaround for current problems regarding our vite plugin + vite's optimizeDeps feature
shamefullyHoist: true
strictPeerDependencies: true

# Workspace root itself depends on runtime, and all packages (including runtime) have a dev dependency on workspace root
# for shared scripts.
ignoreWorkspaceCycles: true
linkWorkspacePackages: false
